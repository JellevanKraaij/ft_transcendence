services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - node_modules_backend:/app/node_modules/
    environment:
      - JWT_SECRET
      - OAUTH42_CLIENT_ID
      - OAUTH42_CLIENT_SECRET
      - OAUTH42_REDIRECT_URI
      - DATABASE_URL

    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - node_modules_frontend:/app/node_modules/
    restart: on-failure
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
  # dbeaver:
  #   image: dbeaver/cloudbeaver:latest
  #   ports:
  #     - "8978:8978"
  # docker run -d -p 8978:8978 --network=host dbeaver/cloudbeaver:latest
  
volumes:
  node_modules_backend:
  node_modules_frontend:
